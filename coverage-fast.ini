# Coverage scope of the `fast` tier -- what it is RESPONSIBLE for (TODO item 47,
# scope A', owner 2026-10-12). Used by `./test.sh fast` and `fast --clean` only,
# via COVERAGE_RCFILE; the integration tier keeps coverage's defaults, so the
# coverage it uploads is unchanged. Not named .coveragerc for that reason:
# coverage would pick that up from every run started at the repo root.
#
# WHY A DECLARED SCOPE. Without one, coverage counts exactly the files the fast
# tests happen to IMPORT, so the denominator is their import graph: two tests
# importing the APKeep and VeriFlow-FR adapters for a class constant added 1,906
# statements at ~11% and cost ~6 points, for code the integration tier
# exercises. And test code counted as covered code (8,531 statements at 96%).
#
# `source` makes every module below count, imported or not: a module no fast
# test reaches is 0%, which is the truth about the tier rather than an artefact.
# ${FAVE_COVERAGE_ROOT} is the tree being measured -- the checkout, or the
# export of `fast --clean` -- set by test.sh.
#
# In scope: FaVe's library packages and PolicyTranslator. Out of scope, by
# omission from `source`: fave/bench/ (the measurement harness and workload
# drivers), fave/misc/, fave/scripts/, fave/examples/, the backend adapters
# under fave/apkeep/, and the vendored ad6/ tree.

[run]
source =
    ${FAVE_COVERAGE_ROOT}/fave/aggregator
    ${FAVE_COVERAGE_ROOT}/fave/ad6
    ${FAVE_COVERAGE_ROOT}/fave/devices
    ${FAVE_COVERAGE_ROOT}/fave/iptables
    ${FAVE_COVERAGE_ROOT}/fave/netplumber
    ${FAVE_COVERAGE_ROOT}/fave/reporting
    ${FAVE_COVERAGE_ROOT}/fave/rule
    ${FAVE_COVERAGE_ROOT}/fave/topology
    ${FAVE_COVERAGE_ROOT}/fave/util
    ${FAVE_COVERAGE_ROOT}/fave/veriflow
    ${FAVE_COVERAGE_ROOT}/policy_translator
omit =
    */test/*
    */deprecated/*
    # Need a native build the fast tier cannot have; the integration tier
    # exercises them: libveriflow_fr, pybison, libnetplumber.
    */fave/veriflow/adapter.py
    */fave/iptables/parser.py
    */fave/netplumber/lib_adapter.py
    */fave/netplumber/lib_transport.py

[report]
# Count directories without __init__.py too, so no module escapes the scope.
include_namespace_packages = true
