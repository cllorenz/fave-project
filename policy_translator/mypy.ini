# mypy configuration for the PolicyTranslator tool.
#
# PolicyTranslator is an independent tool with its own source root, so it is
# type-checked independently of fave (separate config, separate mypy_path),
# mirroring how its tests run with their own PYTHONPATH. CI invokes both.
#
# Gradual typing: the default section stays lenient; individual modules opt
# into strict checking via the per-module sections below.

[mypy]
python_version = 3.12
mypy_path = policy_translator
explicit_package_bases = True
warn_unused_configs = True
warn_redundant_casts = True
ignore_missing_imports = True

# Catch-all: any module not matched by a more-specific section is ignored.
[mypy-*]
ignore_errors = True

# --- typed modules: strict ---------------------------------------------------
[mypy-policy_exceptions]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

[mypy-policy_logger]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

# fpl_grammar/policy/policy_builder/policy_translator -- pyparsing/regex/CLI
# boundaries with Any-valued parse results, so warn_return_any is OFF.
[mypy-fpl_grammar]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = False

[mypy-policy]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
