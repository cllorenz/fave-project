name: CI

# One suite, one entry point: every job invokes `test.sh <tier>`. CI selects a
# tier; it never defines its own tests. Tiers are split by dependency footprint:
#   - fast        : pure-Python, no native deps -> the merge gate
#   - integration : NetPlumber (C++) + bison-dependent tests, NO live backend
#                   -> deterministic, gates merges
#   - e2e         : tests needing a live net_plumber backend (test_rpc + smoke)
#                   -> process/`/dev/shm` orchestration, non-gating for now
#   - bench       : large benchmarks -> manual only (workflow_dispatch)
#
# Replaces the retired .gitlab-ci.yml (kept in-tree until this workflow is
# confirmed green on real CI, then delete it -- see TODO.md item 0).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- Fast tier: always-on merge gate. Pure Python, no system packages. ---
  fast:
    name: fast tests (native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      # Run under coverage with the ratchet floor: the fast tier holds the bulk
      # of the Python tests, so it is the deterministic place to gate coverage.
      # COVERAGE_MIN is the floor -- bump it up as coverage rises, never down.
      - name: Run fast tier (with coverage ratchet)
        run: COVERAGE=1 COVERAGE_MIN=75 bash test.sh fast

  # --- Lint: non-gating until TODO item 2 makes lint_test.sh fail on errors. ---
  lint:
    name: lint (pylint errors/fatals)
    runs-on: ubuntu-24.04
    # Gating: lint_test.sh exits non-zero on pylint error/fatal findings
    # (style is reported but does not gate).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flex bison
          pip install -r requirements.txt pybison pylint
      - name: Lint
        run: cd fave && PYTHONPATH=. bash test/lint_test.sh

  # --- Type check: gates on mypy errors over the typed core slice (the strict
  # sections in mypy.ini). Pure Python, no system packages (mypy is static). ---
  typecheck:
    name: typecheck (mypy, core slice)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Type-check core modules
        run: bash fave/test/typecheck_test.sh

  # --- Integration tier: deterministic (build + C++ tests + bison tests). Gates. ---
  integration:
    name: integration tests (deterministic)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fave-native
      - name: Run integration tier (with coverage)
        run: COVERAGE=1 bash test.sh integration
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  # --- Sanitizers: build NetPlumber with ASan+UBSan (+LeakSanitizer) and run
  # the C++ unit suite. Deterministic, like integration. Catches memory-safety
  # and undefined-behaviour regressions (e.g. the remove_link foreign-iterator
  # UB and the hs_add_hs out-of-bounds write) that a plain build silently
  # tolerates. The suite is currently clean under all three sanitizers. ---
  sanitizers:
    name: sanitizers (asan+ubsan, C++ suite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fave-native
      - name: Rebuild NetPlumber with ASan+UBSan
        # DEBUG_FLAGS feeds GCFLAGS, which the build applies at both compile and
        # link. -fno-sanitize-recover=all makes UBSan abort (non-zero exit) on
        # the first finding instead of only logging it, so the job actually gates.
        run: |
          make -C net_plumber/build clean
          make -j -C net_plumber/build \
            DEBUG_FLAGS="-g -fsanitize=address,undefined -fno-sanitize-recover=all" all
      - name: Run C++ unit suite under sanitizers
        # Leak detection stays on (the suite is leak-clean); print_stacktrace
        # symbolises UBSan findings (we built with -g).
        run: |
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
            net_plumber/build/net_plumber --test

  # --- C++ coverage: build NetPlumber with gcov instrumentation, run the C++
  # unit suite, and publish an lcov/genhtml report as an artifact. REPORT-ONLY:
  # it never fails on the coverage percentage (mirrors the Python coverage,
  # which is uploaded from the integration job rather than gated). ---
  coverage-cxx:
    name: C++ coverage (gcov/lcov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fave-native
      - name: Install lcov
        shell: bash
        run: sudo apt-get install -y --no-install-recommends lcov
      - name: Rebuild NetPlumber with gcov instrumentation
        # --coverage instruments (compile + link, via GCFLAGS); -O0 keeps the
        # line mapping accurate. The makefile's own `coverage` target is NOT used
        # -- its COV_FLAGS never reach GCFLAGS (the sources.mk line is commented),
        # so it would run gcov over an uninstrumented build.
        run: |
          make -C net_plumber/build clean
          make -j -C net_plumber/build DEBUG_FLAGS="--coverage -O0 -g" all
      - name: Run C++ unit suite (generates .gcda)
        run: net_plumber/build/net_plumber --test
      - name: Capture and report coverage (engine code only)
        # lcov 2.0 on Ubuntu 24.04 is strict; ignore the benign template/header
        # inconsistencies. Exclude vendored jsoncpp, system headers, and the test
        # sources -- we measure coverage of the engine, not of the tests.
        run: |
          cd net_plumber/build
          lcov --capture --directory . --base-directory ../src \
            --gcov-tool gcov --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors mismatch,gcov,source,unused \
            --output-file coverage.info
          lcov --remove coverage.info '*/jsoncpp/*' '/usr/*' '*/test/*' \
            --ignore-errors unused --output-file coverage.info
          lcov --summary coverage.info
          genhtml coverage.info --output-directory coverage_html \
            --ignore-errors source,inconsistent,corrupt,category
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cxx-coverage-html
          path: net_plumber/build/coverage_html
          if-no-files-found: ignore

  # --- E2E tier: needs a live net_plumber backend. Non-gating for now. ---
  e2e:
    name: e2e tests (live backend)
    runs-on: ubuntu-24.04
    continue-on-error: true  # backend/process orchestration; promote to gating once reliable
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fave-native
        with:
          report-tools: 'true'
      - name: Run e2e tier (test_rpc + smoke)
        run: bash test.sh e2e

  # --- Benchmarks: heavy; manual only so PRs are not held up. ---
  bench:
    name: benchmarks (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fave-native
        with:
          report-tools: 'true'
      - name: Run benchmarks
        run: bash test.sh bench
