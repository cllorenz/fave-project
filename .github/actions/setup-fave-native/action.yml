name: Set up FaVe native build
description: >
  Install the system + Python dependencies and build/install NetPlumber on an
  Ubuntu 24.04 runner. Used by the integration, e2e, and bench jobs so the heavy
  setup is defined once. Requires the repository to be checked out first.

inputs:
  report-tools:
    description: >
      Install report/visualization tooling (pandoc, inkscape, minimal LaTeX).
      Only the e2e/bench tiers generate reports, so the deterministic
      integration gate leaves this off (default) to stay lean.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install core system dependencies (Ubuntu 24.04, matches Dockerfile)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential flex bison \
          liblog4cxx15 liblog4cxx-dev \
          libcppunit-1.15-0 libcppunit-dev \
          openjdk-11-jdk-headless maven \
          pybind11-dev

    # Report (pandoc -> PDF via pdflatex) and policy visualization (inkscape).
    # Minimal LaTeX: the generated report is plain markdown (headings, lists,
    # inline code -- no tables/images/math), so base + recommended + fonts is
    # enough; texlive-latex-extra (tables/longtable etc.) is intentionally omitted.
    # `lmodern` is listed explicitly: pandoc's default template needs lmodern.sty,
    # which is a standalone package that texlive-fonts-recommended only
    # *recommends* -- so --no-install-recommends would otherwise skip it.
    - name: Install report/visualization tools
      if: inputs.report-tools == 'true'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          pandoc inkscape \
          texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
          lmodern

    - name: Install Python dependencies
      shell: bash
      # pybison + JPype1 are native/integration-only (need flex/bison and a JVM
      # respectively), so they are installed here rather than in requirements.txt
      # (which stays pure-Python for the fast tier). JPype1 drives the APKeep
      # backend in-process; see fave/apkeep/lib_apkeep.py.
      run: pip install -r requirements.txt pybison JPype1

    - name: Build and install NetPlumber
      shell: bash
      run: |
        # Build with -fPIC so the same objects link both the net_plumber
        # executable AND the libnetplumber shared module (the binding links the
        # core .o files; a non-PIC build cannot go into a .so). PIC executables
        # behave identically, so the C++ tests are unaffected.
        make -j -C net_plumber/build DEBUG_FLAGS=-fPIC all
        sudo make -C net_plumber/build install

    # libnetplumber: in-process binding used by the e2e equivalence test
    # (test_lib_equivalence). LIBNP_ASSUME_PIC=1 skips its own -fPIC rebuild
    # since the step above already produced PIC objects.
    - name: Build libnetplumber binding
      shell: bash
      run: LIBNP_ASSUME_PIC=1 bash net_plumber/python/build_libnetplumber.sh
