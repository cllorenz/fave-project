# mypy configuration for FaVe -- see TODO.md item 6.
#
# Strategy: the repo is essentially 0% typed today, so we do NOT flip on a
# global --strict. Instead the default section stays lenient and individual
# *core* modules opt into strict checking via per-module [mypy-<pkg>.*]
# sections below. "Core module" is thereby a literal, reviewable list here.
#
# Typed leaf-first, in dependency order (TODO 6b): a module is only moved into
# a strict section once the modules it imports are typed, otherwise its calls
# into untyped leaves yield Any and the strictness is hollow.
#
# Run (from the repo root):
#   PYTHONPATH=fave python -m mypy --config-file mypy.ini fave/rule/rule_model.py
# mypy analyses statically (no import of the native stack), so this runs in the
# pure-Python `fast` tier -- pybison etc. are handled by ignore_missing_imports.

[mypy]
python_version = 3.12
mypy_path = fave
explicit_package_bases = True
warn_unused_configs = True
warn_redundant_casts = True
# Untyped leaf deps (netplumber.vector, util.ip6np_util, ...) and untyped
# third-party packages (dd, cachetools, graphviz, pyparsing) plus the native,
# integration-only pybison are treated as Any rather than hard import errors.
# As leaves get typed (TODO 6b/6d) this can be tightened per-module.
ignore_missing_imports = True
# Default section is lenient: untyped modules are not flagged. Core modules
# below opt in to the strict checks.

# --- core modules: strict (TODO item 6) --------------------------------------
# rule/ -- foundational data model (highest fan-in leaf). Pilot module.
[mypy-rule.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
# warn_return_any is now ON: util.ip6np_util (rule_model's last untyped
# dependency) is typed, so field_value_to_bitvector / bitvector_to_field_value
# return concrete types rather than Any. This is the leaf-first payoff (TODO 6b).
warn_return_any = True

# netplumber.vector / netplumber.mapping -- header-space + field-mapping leaves.
# These are true leaves (no pass-through of untyped Any into returns), so the
# stricter warn_return_any is ON. Listed per-module (not netplumber.*) so the
# still-untyped netplumber modules (adapter, jsonrpc, slice, ...) are not pulled
# into the strict gate until they are typed in turn.
[mypy-netplumber.vector]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

[mypy-netplumber.mapping]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

# util.ip6np_util -- field <-> bitvector conversion. All its dependencies
# (util.packet_util, netplumber.vector, netplumber.mapping) are now typed, so
# bitvector_to_field_value returns Optional[str] rather than Any: warn_return_any
# is ON (leaf-first payoff, TODO 6b).
[mypy-util.ip6np_util]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

# util.packet_util -- packet constants + (de)normalization helpers. Pure leaf
# (only stdlib `re`), so the strictest settings apply.
[mypy-util.packet_util]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

# util.collections_util -- generic dict/list set operations. Pure leaf, typed
# with TypeVars to preserve genericity.
[mypy-util.collections_util]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

# util.tree_util -- AST (a list subclass). Pure leaf.
[mypy-util.tree_util]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True
