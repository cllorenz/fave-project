# mypy configuration for FaVe.
#
# Gradual typing: the default section stays lenient and individual core modules
# opt into strict checking via the per-module sections below, which form the
# reviewable list of typed modules. Modules are typed leaf-first so a strict
# module's dependencies are themselves typed (else calls into them yield Any).

[mypy]
python_version = 3.12
mypy_path = fave
explicit_package_bases = True
warn_unused_configs = True
warn_redundant_casts = True
# Untyped leaf deps and untyped third-party packages (dd, cachetools, graphviz,
# pyparsing, the native pybison) are treated as Any rather than import errors.
ignore_missing_imports = True

# Catch-all: any module not matched by a more-specific section is ignored, so a
# typed module can import a not-yet-typed sibling without reporting errors in it.
[mypy-*]
ignore_errors = True

# --- core modules: strict ----------------------------------------------------
[mypy-rule.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

# netplumber.vector / netplumber.mapping -- header-space + field-mapping leaves.
# These are true leaves (no pass-through of untyped Any into returns), so the
# stricter warn_return_any is ON. Listed per-module (not netplumber.*) so the
# still-untyped netplumber modules (adapter, jsonrpc, slice, ...) are not pulled
# into the strict gate until they are typed in turn.
[mypy-netplumber.vector]
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_unused_ignores = True
warn_return_any = True

[mypy-netplumber.mapping]
disallow_untyped_defs = True
disallow_incomplete_defs = True
